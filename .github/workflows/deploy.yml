name: Deploy demo site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build
        run: |
          cd exampleSite
          hugo --themesDir ../.. --theme hugo-ink --minify --panicOnWarning \
            --baseURL https://vinooganesh.github.io/hugo-ink/

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: exampleSite/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
